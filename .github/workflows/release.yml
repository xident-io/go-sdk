name: Release

# There is deliberately NO publish job here, and adding one would be wrong.
#
# Go modules have no registry upload step: proxy.golang.org fetches straight
# from the git tag the first time anyone requests the version. Pushing the tag
# IS the publish. Verified 2026-08-10 — v2.0.0 and v2.1.0 are already served by
# the proxy with nothing in CI ever having pushed them.
#
# The consequence to respect: a version the proxy has served is cached
# IMMUTABLY. Re-cutting a tag does not reach consumers, so this workflow's only
# useful job is to fail LOUDLY before a bad tag is ever pushed — which is what
# version-guard does.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  version-guard:
    name: Version guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      # This is the only moment where the tag and the source tree are both
      # known, which is why the SDKVersion/tag comparison has to happen here.
      #
      # github.ref_name is handed to us by GitHub, so it needs no git history:
      # the default shallow, tagless checkout above is enough. A test that
      # instead ran `git describe` would fail here and pass on a laptop.
      #
      # The comparison itself lives in TestSDKVersionMatchesReleaseTag rather
      # than in this file, so the rule is Go code under review, not shell.
      - name: SDKVersion must match the tag
        env:
          XIDENT_RELEASE_VERSION: ${{ github.ref_name }}
        run: go test ./... -run TestSDKVersionMatchesReleaseTag -v

      - name: Full test suite
        run: go test ./...
